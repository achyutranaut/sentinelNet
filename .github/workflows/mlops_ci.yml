name: SentinelNet MLOps CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  mlops-validation-and-testing:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install System Dependencies (OpenMP for LightGBM/XGBoost)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgomp1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Schema & Invariant Tests (ml-ops.org Data Tests)
      run: |
        PYTHONPATH=. pytest tests/test_data_validation.py -v

    - name: Run Model Quality & Reproducibility Tests (ml-ops.org Model Tests)
      run: |
        PYTHONPATH=. pytest tests/test_model_quality.py -v

    - name: Execute Automated Continuous Training (CT) Pipeline
      run: |
        PYTHONPATH=. python src/pipeline.py --quick

    - name: Verify Training-Serving Skew Elimination (ml-ops.org Skew Tests)
      run: |
        PYTHONPATH=. pytest tests/test_training_serving_skew.py -v

    - name: Benchmark Infrastructure Latency & Endpoints (ml-ops.org Infra Tests)
      run: |
        PYTHONPATH=. pytest tests/test_api_service.py -v
